name: Import initial Athlys binaries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-initial-builds.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts from the private build pipeline
        env:
          WINDOWS_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-07dc-8210-9a8b-a0fb22f205cb/raw?se=2026-11-03T00%3A03%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=6ad94d42-ff15-550e-83e3-b21e2186e940&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A27%3A04Z&ske=2026-11-03T22%3A27%3A04Z&sks=b&skv=2026-02-06&sig=hOdDRRa3eYvkBUzUxBTqvB3%2BDUGw0xUtswuPKr8YurU%3D"
          MAC_ARM_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-b8e0-81f4-a923-ea68d009da53/raw?se=2026-11-03T00%3A03%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=4347b105-0642-5ff6-8137-763acbba2062&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A55%3A41Z&ske=2026-11-03T22%3A55%3A41Z&sks=b&skv=2026-02-06&sig=CrWSdtpapaDi8SgM67uno7ToeL4Jzpc0MtrXWbLXzRQ%3D"
          MAC_X64_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-77c0-8243-8ca8-b443065a476d/raw?se=2026-11-03T00%3A03%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=150be494-2743-554b-8c87-6741bf39f6a3&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T10%3A28%3A55Z&ske=2026-11-03T10%3A28%3A55Z&sks=b&skv=2026-02-06&sig=mSArdAWFz0bBVh31Z067n%2B43tSpgsQQ5MuuVf7a%2BbyA%3D"
          ANDROID_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-e90c-81f4-9fa5-1b4dd3085a6c/raw?se=2026-11-03T00%3A03%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=fcb95a3f-7c47-581a-b917-01d66c393169&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A12%3A20Z&ske=2026-11-03T22%3A12%3A20Z&sks=b&skv=2026-02-06&sig=x4p%2BFPFEBjcUCkcGX/k8BBiXuGmWFMBWQwhUJvaRXaE%3D"
          IOS_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-1190-820a-9a9a-9942f1c33230/raw?se=2026-11-03T00%3A03%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=3f3a8b10-c888-5a22-9d1c-171be2ebde68&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A50%3A54Z&ske=2026-11-03T22%3A50%3A54Z&sks=b&skv=2026-02-06&sig=OtQ2rbCsegXrpnZDpXfIslQrMuL2nyUph9lYIUZ8CDE%3D"
        run: |
          set -euo pipefail
          mkdir -p /tmp/athlys /tmp/athlys/dist
          curl --fail --location "$WINDOWS_URL" -o /tmp/athlys/windows.zip
          curl --fail --location "$MAC_ARM_URL" -o /tmp/athlys/mac-arm64.zip
          curl --fail --location "$MAC_X64_URL" -o /tmp/athlys/mac-x64.zip
          curl --fail --location "$ANDROID_URL" -o /tmp/athlys/android.zip
          curl --fail --location "$IOS_URL" -o /tmp/athlys/ios.zip
          unzip -j /tmp/athlys/windows.zip 'Athlys-1.0.0-x64.exe' -d /tmp/athlys/dist
          unzip -j /tmp/athlys/windows.zip 'Athlys-Portable-1.0.0-x64.exe' -d /tmp/athlys/dist
          unzip -j /tmp/athlys/mac-arm64.zip 'Athlys-1.0.0-arm64.dmg' -d /tmp/athlys/dist
          unzip -j /tmp/athlys/mac-x64.zip 'Athlys-1.0.0-x64.dmg' -d /tmp/athlys/dist
          unzip -p /tmp/athlys/android.zip app-debug.apk > /tmp/athlys/dist/Athlys-Android.apk
          cp /tmp/athlys/ios.zip /tmp/athlys/dist/athlys-ios-development.zip
          test -s /tmp/athlys/dist/Athlys-1.0.0-x64.exe
          test -s /tmp/athlys/dist/Athlys-1.0.0-arm64.dmg
          test -s /tmp/athlys/dist/Athlys-1.0.0-x64.dmg
          test -s /tmp/athlys/dist/Athlys-Android.apk
          test -s /tmp/athlys/dist/athlys-ios-development.zip

      - name: Publish Windows release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: athlys-windows-latest
          name: Athlys Windows — dernière version
          body: "Windows x64. Installateur et version portable. Build non signée : SmartScreen peut afficher un avertissement."
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            /tmp/athlys/dist/Athlys-1.0.0-x64.exe
            /tmp/athlys/dist/Athlys-Portable-1.0.0-x64.exe

      - name: Publish macOS release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: athlys-macos-latest
          name: Athlys macOS — dernière version
          body: "DMG Apple Silicon et Intel. Builds non signées et non notariées."
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            /tmp/athlys/dist/Athlys-1.0.0-arm64.dmg
            /tmp/athlys/dist/Athlys-1.0.0-x64.dmg

      - name: Publish Android release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: athlys-android-latest
          name: Athlys Android — dernière version de test
          body: "APK debug de test, non publiée sur Google Play et non signée avec une clé de production."
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: /tmp/athlys/dist/Athlys-Android.apk

      - name: Publish iOS development archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: athlys-ios-simulator-latest
          name: Athlys iOS — archives de développement
          body: "Archives Xcode et simulateur uniquement. Pas une IPA installable sur iPhone."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: /tmp/athlys/dist/athlys-ios-development.zip

      - name: Remove one-time import workflow
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const path = ".github/workflows/import-initial-builds.yml";
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              sha: file.sha,
              message: "Remove one-time Athlys binary import workflow"
            });
